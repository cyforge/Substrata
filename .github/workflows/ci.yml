name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install documentation dependencies
        run: npm ci

      - name: Check documentation links and types
        run: |
          npm test
          npm run check

      - name: Build static documentation
        run: npm run build

      - name: Retain static website
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: website/dist/public
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Run lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Build wheel and source archive
        if: matrix.python-version == '3.11'
        run: python -m build

      - name: Check source archive contents
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile

          with tarfile.open(next(Path("dist").glob("*.tar.gz"))) as archive:
              names = archive.getnames()
          assert any(name.endswith("/substrata/__init__.py") for name in names)
          assert not any("/website/" in name for name in names), "Website leaked into SDK archive"
          PY

      - name: Install built wheel and check CLI
        if: matrix.python-version == '3.11'
        run: |
          python -m venv "$RUNNER_TEMP/substrata-venv"
          "$RUNNER_TEMP/substrata-venv/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/substrata-venv/bin/substrata" --version
          "$RUNNER_TEMP/substrata-venv/bin/substrata" --help
          "$RUNNER_TEMP/substrata-venv/bin/substrata" config show
          "$RUNNER_TEMP/substrata-venv/bin/substrata" demo --database "$RUNNER_TEMP/demo.sqlite3"
          "$RUNNER_TEMP/substrata-venv/bin/substrata" audit verify --database "$RUNNER_TEMP/demo.sqlite3"

  stellar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install optional Stellar SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,stellar]"

      - name: Run tests with Stellar SDK
        run: python -m pytest
