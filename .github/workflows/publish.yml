name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "substrata-sdk"
          assert os.environ["RELEASE_TAG"] == f"v{project['version']}", "Tag must match package version"
          PY

      - name: Install build and test tools
        run: python -m pip install -e ".[dev]" twine

      - name: Verify SDK
        run: |
          python -m ruff check .
          python -m pytest

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Retain release distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-release
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/substrata-sdk
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-release
          path: dist

      - name: Publish using PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
