[project]
name = "substrata-sdk"
version = "0.1.0"
description = "Python-first AgentPay SDK for autonomous machine-to-machine payments on Stellar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = {file = "LICENSE"}
keywords = ["stellar", "x402", "payments", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/cyforge/Substrata"
Issues = "https://github.com/cyforge/Substrata/issues"
Documentation = "https://github.com/cyforge/Substrata/blob/main/docs/index.md"

[project.optional-dependencies]
stellar = ["stellar-sdk>=17,<18"]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "build>=1.2",
]

[project.scripts]
substrata = "substrata.cli:entrypoint"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/website"]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["substrata"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]
